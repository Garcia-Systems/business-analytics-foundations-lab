[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "business-analytics-foundations-lab"
version = "0.1.0"
description = "An executable preparation textbook for graduate business analytics"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "matplotlib>=3.9",
  "numpy>=2.0",
  "pandas>=2.2",
  "scipy>=1.14",
  "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = [
  "jupyter>=1.1",
  "pytest>=8.3",
]

[project.scripts]
analytics-foundations = "analytics_foundations.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/analytics_foundations"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

